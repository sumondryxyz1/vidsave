services:
  - type: web
    name: vidsave
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: MAX_CONCURRENT
        value: 2
      - key: MAX_FILESIZE_MB
        value: 500
      - key: JOB_TTL
        value: 1800
