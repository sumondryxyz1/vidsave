<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Downloader — যেকোনো সাইট থেকে ভিডিও</title>
<style>
  :root {
    --bg: #0b0f17;
    --card: rgba(22, 28, 41, 0.72);
    --border: rgba(255, 255, 255, 0.09);
    --text: #eef2f9;
    --muted: #9aa6bd;
    --brand: #6d8cff;
    --brand2: #b06dff;
    --ok: #35d39a;
    --err: #ff6b81;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Hind Siliguri", "Noto Sans Bengali", -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    background-image:
      radial-gradient(60rem 40rem at 12% -10%, rgba(109,140,255,.28), transparent 60%),
      radial-gradient(50rem 40rem at 95% 0%, rgba(176,109,255,.22), transparent 55%);
    display: flex;
    justify-content: center;
    padding: 6vh 18px 60px;
  }
  .wrap { width: 100%; max-width: 720px; }
  header { text-align: center; margin-bottom: 28px; }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 15px; letter-spacing: .3px;
    color: var(--muted); text-transform: uppercase;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    box-shadow: 0 0 18px rgba(109,140,255,.8);
  }
  h1 {
    font-size: clamp(28px, 5.5vw, 42px); line-height: 1.15; margin: 14px 0 8px;
    background: linear-gradient(120deg, #fff, #b9c6ff 55%, #d9b8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); font-size: 15px; margin: 0; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px rgba(0,0,0,.42);
    padding: 22px;
  }
  .row { display: flex; gap: 10px; }
  input[type=url] {
    flex: 1; min-width: 0;
    background: rgba(8, 11, 18, .8);
    border: 1px solid var(--border);
    border-radius: 13px;
    color: var(--text); font-size: 15px; padding: 15px 16px;
    outline: none; transition: border-color .18s, box-shadow .18s;
  }
  input[type=url]:focus {
    border-color: rgba(109,140,255,.7);
    box-shadow: 0 0 0 4px rgba(109,140,255,.15);
  }
  button {
    font-family: inherit; font-size: 15px; font-weight: 700;
    border: none; border-radius: 13px; cursor: pointer;
    padding: 15px 22px; color: #fff;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    transition: transform .12s, filter .18s, opacity .18s;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .hint { color: var(--muted); font-size: 13px; margin: 12px 2px 0; }

  .result { margin-top: 20px; display: none; }
  .result.show { display: block; animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .meta { display: flex; gap: 16px; align-items: center; }
  .thumb {
    width: 132px; aspect-ratio: 16/9; flex: none; object-fit: cover;
    border-radius: 12px; border: 1px solid var(--border); background: #000;
  }
  .meta .txt { min-width: 0; }
  .meta h2 { font-size: 17px; margin: 0 0 6px; line-height: 1.3; }
  .meta p { margin: 0; color: var(--muted); font-size: 13.5px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 6px; }
  .chip {
    border: 1px solid var(--border); background: rgba(255,255,255,.04);
    color: var(--text); padding: 9px 15px; border-radius: 999px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .chip:hover { border-color: rgba(109,140,255,.6); }
  .chip.active {
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    border-color: transparent; color: #fff;
  }

  .bar-wrap { margin-top: 18px; display: none; }
  .bar-wrap.show { display: block; }
  .bar-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--brand), var(--brand2));
    transition: width .3s ease;
  }
  .status { margin-top: 14px; font-size: 14px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .save {
    display: none; margin-top: 16px; text-align: center; text-decoration: none;
  }
  .save.show { display: block; }
  footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 26px; }
  footer a { color: var(--brand); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot"></span> Downloader</div>
    <h1>যেকোনো সাইট থেকে<br />ভিডিও নামান</h1>
    <p class="sub">YouTube · Facebook · Instagram · TikTok · X — লিংক পেস্ট করুন</p>
  </header>

  <div class="card">
    <form class="row" id="form">
      <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" required />
      <button type="submit" id="probeBtn">খুঁজুন</button>
    </form>
    <p class="hint">ডাউনলোড ইঞ্জিন: yt-dlp — ১০০০+ সাইট সাপোর্টেড।</p>

    <div class="result" id="result">
      <div class="meta">
        <img class="thumb" id="thumb" alt="" />
        <div class="txt">
          <h2 id="title"></h2>
          <p id="metaLine"></p>
        </div>
      </div>

      <div class="chips" id="chips"></div>

      <button id="dlBtn" style="width:100%; margin-top:14px;">ডাউনলোড</button>

      <div class="bar-wrap" id="barWrap">
        <div class="bar-top"><span id="pct">0%</span><span id="speed"></span></div>
        <div class="bar"><i id="bar"></i></div>
      </div>

      <div class="status" id="status"></div>
      <a class="save" id="save" download>⬇️ ফাইল সেভ করুন</a>
    </div>
  </div>

  <footer>
    শুধু নিজের বা অনুমোদিত কনটেন্ট নামান। টেলিগ্রাম বট ভার্সনও আছে —
    <code>bot.py</code>। ব্রাউজারে বড় ফাইল সরাসরি নামে, কোনো ৫০MB সীমা নেই।
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let current = null;       // probed info
let selected = "best";    // chosen quality
let es = null;            // EventSource

const fmtDur = (s) => {
  if (!s) return "";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
           : `${m}:${String(sec).padStart(2,"0")}`;
};

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = $("url").value.trim();
  if (!url) return;
  resetOutput();
  $("probeBtn").disabled = true;
  $("probeBtn").textContent = "খুঁজছি…";
  try {
    const r = await fetch("/api/probe", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || "লিংক পাওয়া যায়নি");
    current = await r.json();
    renderResult(current);
  } catch (err) {
    showStatus(err.message, "err");
  } finally {
    $("probeBtn").disabled = false;
    $("probeBtn").textContent = "খুঁজুন";
  }
});

function resetOutput() {
  if (es) { es.close(); es = null; }
  $("result").classList.remove("show");
  $("barWrap").classList.remove("show");
  $("save").classList.remove("show");
  $("status").textContent = "";
  $("status").className = "status";
}

function renderResult(info) {
  $("result").classList.add("show");
  $("title").textContent = info.title || "media";
  const parts = [];
  if (info.uploader) parts.push(info.uploader);
  if (info.duration) parts.push("⏱ " + fmtDur(info.duration));
  $("metaLine").textContent = parts.join("  ·  ");
  const thumb = $("thumb");
  if (info.thumbnail) { thumb.src = info.thumbnail; thumb.style.display = ""; }
  else thumb.style.display = "none";

  const chips = $("chips");
  chips.innerHTML = "";
  const opts = (info.qualities || []).map(q => ({ value: String(q), label: `🎬 ${q}p` }));
  opts.push({ value: "best", label: "⭐ সেরা" });
  opts.push({ value: "audio", label: "🎵 MP3" });

  selected = opts.length ? opts[opts.length - 2].value : "best";
  opts.forEach((o) => {
    const b = document.createElement("button");
    b.className = "chip" + (o.value === selected ? " active" : "");
    b.textContent = o.label;
    b.onclick = () => {
      selected = o.value;
      [...chips.children].forEach(c => c.classList.remove("active"));
      b.classList.add("active");
    };
    chips.appendChild(b);
  });
}

$("dlBtn").addEventListener("click", async () => {
  if (!current) return;
  resetOutput();
  $("result").classList.add("show");
  renderResult(current);
  $("dlBtn").disabled = true;
  showStatus("শুরু হচ্ছে…", "");
  try {
    const r = await fetch("/api/download", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: current.webpage_url || $("url").value, quality: selected }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || "ডাউনলোড শুরু হয়নি");
    const { job_id } = await r.json();
    $("barWrap").classList.add("show");
    trackProgress(job_id);
  } catch (err) {
    showStatus(err.message, "err");
    $("dlBtn").disabled = false;
  }
});

function trackProgress(jobId) {
  es = new EventSource(`/api/progress/${jobId}`);
  es.onmessage = (ev) => {
    const j = JSON.parse(ev.data);
    const pct = Math.max(0, Math.min(100, j.progress || 0));
    $("bar").style.width = pct + "%";
    $("pct").textContent = pct.toFixed(0) + "%";
    $("speed").textContent = [j.speed, j.eta && "ETA " + j.eta].filter(Boolean).join("  ");

    if (j.status === "ready") {
      es.close(); es = null;
      $("bar").style.width = "100%";
      showStatus("✅ সম্পন্ন — ফাইল সেভ করুন", "ok");
      const a = $("save");
      a.href = `/api/file/${jobId}`;
      a.setAttribute("download", j.filename || "");
      a.classList.add("show");
      $("dlBtn").disabled = false;
      a.click();
    } else if (j.status === "error") {
      es.close(); es = null;
      showStatus("❌ " + (j.error || "ডাউনলোড ব্যর্থ"), "err");
      $("dlBtn").disabled = false;
    } else {
      showStatus("⏳ ডাউনলোড হচ্ছে…", "");
    }
  };
  es.onerror = () => { if (es) { es.close(); es = null; } };
}

function showStatus(msg, kind) {
  const s = $("status");
  s.textContent = msg;
  s.className = "status" + (kind ? " " + kind : "");
}
</script>
</body>
</html>
