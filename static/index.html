<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="যেকোনো সাইট থেকে ভিডিও ও অডিও ডাউনলোড করুন।" />
<title>Downloader — ভিডিও ও অডিও ডাউনলোড</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0e16;
    --panel: #141b2b;
    --border: rgba(255,255,255,.09);
    --text: #eef2f9;
    --muted: #94a0b8;
    --brand: #6d8cff;
    --brand2: #b06dff;
    --ok: #35d39a;
    --err: #ff6b81;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: "Hind Siliguri", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(60rem 40rem at 50% -10%, rgba(109,140,255,.22), transparent 60%);
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 18px 40px;
  }
  .top { width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 46px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .brand i {
    width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--brand), var(--brand2)); font-style: normal; font-size: 16px;
  }
  .home-btn {
    display: none; text-decoration: none; color: var(--text); font-size: 14px; font-weight: 600;
    background: rgba(255,255,255,.06); border: 1px solid var(--border);
    padding: 9px 15px; border-radius: 11px; transition: border-color .15s;
  }
  .home-btn.show { display: inline-block; }
  .home-btn:hover { border-color: var(--brand); }

  .wrap { width: 100%; max-width: 560px; }
  .head { text-align: center; margin-bottom: 26px; }
  .head h1 { font-size: clamp(24px, 5vw, 32px); margin: 0 0 10px; font-weight: 700; }
  .head p { color: var(--muted); margin: 0; font-size: 15px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 20px; }
  .row { display: flex; gap: 10px; }
  input[type=url] {
    flex: 1; min-width: 0; font-family: inherit; font-size: 15px; color: var(--text);
    background: rgba(0,0,0,.35); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; outline: none; transition: border-color .15s;
  }
  input[type=url]::placeholder { color: #6b7688; }
  input[type=url]:focus { border-color: var(--brand); }
  .btn {
    font-family: inherit; font-size: 15px; font-weight: 700; border: none; border-radius: 12px;
    padding: 14px 22px; color: #fff; cursor: pointer; white-space: nowrap;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    transition: filter .15s, transform .12s, opacity .15s;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.danger { background: linear-gradient(135deg, #ff5f6d, #ff8a5b); }
  .btn.ghost { background: rgba(255,255,255,.07); border: 1px solid var(--border); }

  .result { margin-top: 18px; display: none; }
  .result.show { display: block; animation: rise .3s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .meta { display: flex; gap: 14px; align-items: center; }
  .thumb { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 11px; border: 1px solid var(--border); background: #000; }
  .meta h2 { font-size: 16px; margin: 0 0 5px; line-height: 1.35; }
  .meta p { margin: 0; color: var(--muted); font-size: 13px; }

  .label { font-size: 12px; color: var(--muted); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer;
    background: rgba(255,255,255,.05); border: 1px solid var(--border);
    padding: 9px 15px; border-radius: 999px; transition: all .15s;
  }
  .chip:hover { border-color: var(--brand); }
  .chip.active { background: linear-gradient(135deg, var(--brand), var(--brand2)); border-color: transparent; }

  .toggles { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .toggle {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px;
    background: rgba(255,255,255,.05); border: 1px solid var(--border); padding: 9px 14px; border-radius: 11px;
  }
  .toggle input { accent-color: var(--brand); width: 16px; height: 16px; }

  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .actions .btn { flex: 1; }
  .bar-wrap { margin-top: 16px; display: none; }
  .bar-wrap.show { display: block; }
  .bar-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 7px; }
  .bar { height: 9px; border-radius: 999px; background: rgba(255,255,255,.09); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--brand2)); transition: width .3s; }
  .status { margin-top: 13px; font-size: 14px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .save { display: none; margin-top: 15px; }
  .save.show { display: block; }
  .save .btn { display: block; width: 100%; text-align: center; text-decoration: none; }

  .foot { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 28px; }
</style>
</head>
<body>

<div class="top">
  <div class="brand"><i>⬇</i> Downloader</div>
  <a class="home-btn" id="homeBtn" href="/">হোম</a>
</div>

<div class="wrap">
  <div class="head">
    <h1>ভিডিও ও অডিও ডাউনলোড করুন</h1>
    <p>লিংক পেস্ট করুন, কোয়ালিটি বেছে নিন — ব্যস।</p>
  </div>

  <div class="card">
    <form class="row" id="form">
      <input type="url" id="url" placeholder="ভিডিওর লিংক পেস্ট করুন…" autocomplete="off" required />
      <button type="submit" class="btn" id="probeBtn">খুঁজুন</button>
    </form>

    <div class="result" id="result">
      <div id="details">
      <div class="meta" id="metaRow">
        <img class="thumb" id="thumb" alt="" />
        <div>
          <h2 id="title"></h2>
          <p id="metaLine"></p>
        </div>
      </div>

      <div id="qualityBlock">
        <div class="label">কোয়ালিটি</div>
        <div class="chips" id="chips"></div>
      </div>

      <div id="bitrateBlock" style="display:none">
        <div class="label">অডিও বিটরেট</div>
        <div class="chips" id="bitrates"></div>
      </div>

      <div class="toggles">
        <label class="toggle" id="subsToggle" style="display:none">
          <input type="checkbox" id="subs" /> সাবটাইটেল
        </label>
        <label class="toggle" id="playlistToggle" style="display:none">
          <input type="checkbox" id="playlist" /> পুরো প্লেলিস্ট (ZIP)
        </label>
      </div>

      <div class="actions">
        <button id="dlBtn" class="btn">ডাউনলোড</button>
        <button id="cancelBtn" class="btn danger" style="display:none">বাতিল</button>
      </div>

      <div class="bar-wrap" id="barWrap">
        <div class="bar-top"><span id="pct">0%</span><span id="speed"></span></div>
        <div class="bar"><i id="bar"></i></div>
      </div>
      </div>

      <div class="status" id="status"></div>
      <a class="save" id="save" download><span class="btn">⬇ ফাইল সেভ করুন</span></a>
    </div>
  </div>

  <p class="foot">শুধু নিজের বা অনুমোদিত কনটেন্ট নামান।</p>
</div>

<script>
const $ = (id) => document.getElementById(id);
let current = null, selected = "best", bitrate = 192, jobId = null, es = null;

const fmtDur = (s) => {
  if (!s) return "";
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}` : `${m}:${String(sec).padStart(2,"0")}`;
};

$("homeBtn").addEventListener("click", (e) => {
  e.preventDefault();
  resetAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = $("url").value.trim();
  if (!url) return;
  resetOutput();
  $("probeBtn").disabled = true;
  $("probeBtn").textContent = "খুঁজছি…";
  try {
    const r = await fetch("/api/probe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }) });
    if (!r.ok) throw new Error((await r.json()).detail || "লিংক পাওয়া যায়নি");
    current = await r.json();
    renderResult(current);
  } catch (err) {
    resetOutput();
    $("details").style.display = "none";
    $("result").classList.add("show");
    showStatus(err.message, "err");
  } finally {
    $("probeBtn").disabled = false;
    $("probeBtn").textContent = "খুঁজুন";
  }
});

function resetAll() {
  if (es) { es.close(); es = null; }
  jobId = null;
  $("url").value = "";
  current = null;
  resetOutput();
  $("homeBtn").classList.remove("show");
}

function resetOutput() {
  if (es) { es.close(); es = null; }
  jobId = null;
  $("result").classList.remove("show");
  $("barWrap").classList.remove("show");
  $("save").classList.remove("show");
  $("cancelBtn").style.display = "none";
  $("dlBtn").disabled = false;
  $("bar").style.width = "0%";
  $("status").textContent = "";
  $("status").className = "status";
}

function renderResult(info) {
  $("result").classList.add("show");
  $("homeBtn").classList.add("show");
  $("details").style.display = "";
  $("metaRow").style.display = "";
  $("title").textContent = info.title || "media";
  const parts = [];
  if (info.uploader) parts.push(info.uploader);
  if (info.duration) parts.push("⏱ " + fmtDur(info.duration));
  if (info.is_playlist) parts.push("প্লেলিস্ট · " + info.entry_count + " আইটেম");
  $("metaLine").textContent = parts.join("  ·  ");
  const thumb = $("thumb");
  if (info.thumbnail) { thumb.src = info.thumbnail; thumb.style.display = ""; } else thumb.style.display = "none";

  const chips = $("chips");
  chips.innerHTML = "";
  const opts = (info.qualities || []).map(q => ({ value: String(q), label: q + "p" }));
  opts.push({ value: "best", label: "⭐ সেরা" });
  opts.push({ value: "audio", label: "🎵 MP3" });
  selected = "best";
  opts.forEach((o) => {
    const b = document.createElement("button");
    b.className = "chip" + (o.value === selected ? " active" : "");
    b.textContent = o.label;
    b.onclick = () => {
      selected = o.value;
      [...chips.children].forEach(c => c.classList.remove("active"));
      b.classList.add("active");
      $("bitrateBlock").style.display = o.value === "audio" ? "" : "none";
      $("subsToggle").style.display = o.value === "audio" ? "none" : "";
    };
    chips.appendChild(b);
  });

  const brs = $("bitrates");
  brs.innerHTML = "";
  (info.audio_bitrates || [128, 192, 320]).forEach((v) => {
    const b = document.createElement("button");
    b.className = "chip" + (v === bitrate ? " active" : "");
    b.textContent = v + " kbps";
    b.onclick = () => { bitrate = v; [...brs.children].forEach(c => c.classList.remove("active")); b.classList.add("active"); };
    brs.appendChild(b);
  });

  $("playlistToggle").style.display = info.is_playlist ? "" : "none";
  $("playlist").checked = false;
  $("subsToggle").style.display = "";
  $("bitrateBlock").style.display = "none";
}

$("dlBtn").addEventListener("click", async () => {
  if (!current) return;
  if (es) { es.close(); es = null; }
  $("barWrap").classList.add("show");
  $("save").classList.remove("show");
  $("dlBtn").disabled = true;
  $("cancelBtn").style.display = "";
  showStatus("শুরু হচ্ছে…", "");
  try {
    const r = await fetch("/api/download", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        url: current.webpage_url || $("url").value,
        quality: selected, audio_bitrate: bitrate,
        subtitles: $("subs").checked,
        playlist: $("playlist").checked && current.is_playlist,
      }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || "ডাউনলোড শুরু হয়নি");
    const { job_id } = await r.json();
    jobId = job_id;
    trackProgress(job_id);
  } catch (err) {
    showStatus(err.message, "err");
    $("dlBtn").disabled = false;
    $("cancelBtn").style.display = "none";
  }
});

$("cancelBtn").addEventListener("click", async () => {
  if (jobId) await fetch(`/api/cancel/${jobId}`, { method: "POST" }).catch(() => {});
  showStatus("বাতিলের অনুরোধ পাঠানো হয়েছে…", "");
});

function trackProgress(id) {
  es = new EventSource(`/api/progress/${id}`);
  es.onmessage = (ev) => {
    const j = JSON.parse(ev.data);
    const pct = Math.max(0, Math.min(100, j.progress || 0));
    $("bar").style.width = pct + "%";
    $("pct").textContent = pct.toFixed(0) + "%";
    $("speed").textContent = [j.speed, j.eta && "বাকি " + j.eta].filter(Boolean).join("  ·  ");

    if (j.status === "ready") {
      es.close(); es = null;
      $("bar").style.width = "100%";
      showStatus("✅ সম্পন্ন — ফাইল সেভ করুন", "ok");
      const a = $("save");
      a.href = `/api/file/${id}`;
      a.setAttribute("download", j.filename || "");
      a.classList.add("show");
      $("dlBtn").disabled = false;
      $("cancelBtn").style.display = "none";
      a.click();
    } else if (j.status === "error") {
      es.close(); es = null;
      showStatus("❌ " + (j.error || "ডাউনলোড ব্যর্থ হয়েছে"), "err");
      $("dlBtn").disabled = false;
      $("cancelBtn").style.display = "none";
    } else if (j.status === "cancelled") {
      es.close(); es = null;
      showStatus("বাতিল করা হয়েছে।", "");
      $("dlBtn").disabled = false;
      $("cancelBtn").style.display = "none";
    } else {
      const item = j.total_items ? ` (${j.item}/${j.total_items})` : "";
      showStatus("⏳ ডাউনলোড হচ্ছে…" + item, "");
    }
  };
  es.onerror = () => { if (es) { es.close(); es = null; } };
}

function showStatus(msg, kind) {
  const s = $("status");
  s.textContent = msg;
  s.className = "status" + (kind ? " " + kind : "");
}
</script>
</body>
</html>
